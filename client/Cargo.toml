[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = { workspace = true }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "Storage", "Location", "Window"]

[dev-dependencies]
rand = { workspace = true }
# Lets the native render tests turn views into HTML strings.
leptos = { version = "0.8", features = ["csr", "ssr"] }
